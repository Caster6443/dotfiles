general {
    # layout = dwindle
    layout = scrolling

    allow_tearing = false  # Allows `immediate` window rule to work

    gaps_workspaces = $workspaceGaps
    gaps_in = $windowGapsIn
    gaps_out = $windowGapsOut
    border_size = $windowBorderSize

    col.active_border = $activeWindowBorderColour
    col.inactive_border = $inactiveWindowBorderColour
}

dwindle {
	preserve_split = true
	smart_split = false
	smart_resizing = true
}

scrolling {
    # 单列时是否全屏
    fullscreen_on_one_column = true
    
    # 列宽默认值 (0.1 - 1.0)
    column_width = 0.5
    
    # 聚焦时的视图调整方法 (0 = 居中，1 = 适配)
    focus_fit_method = 1
    
    # 聚焦窗口时是否自动移动视图
    follow_focus = true
    
    # 聚焦时至少可见的比例 (0.0 - 1.0)
    follow_min_visible = 0.4
    
    # 预设的列宽配置 (用于循环切换)
    explicit_column_widths = 0.333, 0.5, 0.667, 1.0
    
    # 新窗口出现和滚动的方向 (left/right/down/up)
    direction = right
}
