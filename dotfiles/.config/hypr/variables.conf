# ### Hyprland ###
# Apps
$terminal = foot
$browser = zen-browser
$editor = codium
$fileExplorer = nautilus

# Touchpad
$touchpadScrollFactor = 0.3
$workspaceSwipeFingers = 3
$gestureFingers = 4
$gestureFingersMore = 5

# Blur
$blurEnabled = true
$blurSpecialWs = false
$blurPopups = true
$blurInputMethods = true
$blurSize = 8
$blurPasses = 2
$blurXray = false

# Shadow
$shadowEnabled = true
$shadowRange = 20
$shadowRenderPower = 3
$shadowColour = rgba($surfaced4)

# Gaps
$workspaceGaps = 20
$windowGapsIn = 10
$windowGapsOut = 40
$singleWindowGapsOut = 20

# Window styling
$windowOpacity = 0.95
$windowRounding = 10

$windowBorderSize = 3
$activeWindowBorderColour = rgba($primarye6)
$inactiveWindowBorderColour = rgba($onSurfaceVariant11)

# Misc
$volumeStep = 10  # In percent
$cursorTheme = sweet-cursors
$cursorSize = 24


# ### Keybinds ###
# Workspaces
$kbMoveWinToWs = Super+Alt
$kbMoveWinToWsGroup = Ctrl+Super+Alt
$kbGoToWs = Super
$kbGoToWsGroup = Ctrl+Super
$kbWindowSwap = Ctrl+Alt

$kbNextWs = Ctrl+Super, right
$kbPrevWs = Ctrl+Super, left

$kbToggleSpecialWs = Super, S
$switch_touchpad_status = Ctrl, F10
$touchpadDisableTyping = true

# Window groups
$kbWindowGroupCycleNext = Alt, Tab
$kbWindowGroupCyclePrev = Shift+Alt, Tab
$kbUngroup = Super, U
$kbToggleGroup = Super, Comma

# Window actions
$kbMoveWindow = Super, Z
$kbWindowPip = Super+Alt, Backslash
$kbPinWindow = Super, P
$kbWindowFullscreen = Super+Shift, F
$kbWindowBorderedFullscreen = Super, F
$kbToggleWindowFloating = Super, V
$kbCloseWindow = Super, Q

# Special workspace toggles
$kbSystemMonitor = Ctrl+Shift, Escape
$kbMusic = Super, M
$kbCommunication = Super, D
$kbTodo = Super, R
$kbNote = Super, O
$kbProxy = Super, P

# Apps
$kbTerminal = Ctrl, T
$kbBrowser = Super, W
$kbEditor = Super, C
$kbFileExplorer = Super, E
$kbLookingGlass = Ctrl+Shift, S

# Misc
$kbSession = Ctrl+Alt, Delete
$kbClearNotifs = Ctrl+Alt, C
$kbShowPanels = Super, K
$kbLock = Super, L
$kbRestoreLock = Super+Alt, L
$cheatsheet = , Menu
$kbReHyprconf = Ctrl+Alt, L
$kbNotifycenter = Super, N

