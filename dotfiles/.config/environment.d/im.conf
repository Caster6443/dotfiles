# fcitx5 input method environment for the whole graphical session
# GTK_IM_MODULE=fcitx  (removed on 2026-08-20: on Wayland fcitx5 uses its own
#   Wayland input-method frontend (text-input-v3) for GTK apps; setting this
#   triggers the "GTK_IM_MODULE is set" warning and can worsen cursor positioning)
QT_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx

# Covers SDL applications (Steam, native SDL2 games etc.)
SDL_IM_MODULE=fcitx
